<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - StudyMatch</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='studysync-ul.css') }}">
</head>
<body class="css-diari auth-page">

    <main class="auth">
        <div class="auth__container">
            <section class="card auth__card">

                <h2 class="auth__title">Inscription</h2>

                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    <div class="messages">
                      {% for category, message in messages %}
                        <p class="message message--{{ category }}">{{ message|safe }}</p>
                      {% endfor %}
                    </div>
                  {% endif %}
                {% endwith %}

                <form id="signupForm" class="form" method="POST" action="{{ url_for('page_signup') }}">

                    <div class="form__group">
                        <label for="prenom" class="form__label">Prénom</label>
                        <input
                            type="text"
                            id="prenom"
                            name="prenom"
                            required
                            class="form__input"
                        />
                    </div>

                    <div class="form__group">
                        <label for="nom" class="form__label">Nom</label>
                        <input
                            type="text"
                            id="nom"
                            name="nom"
                            required
                            class="form__input"
                        />
                    </div>

                    <div class="form__group">
                        <label for="email" class="form__label">Courriel universitaire</label>
                        <input
                            type="email"
                            id="email"
                            name="email_ulaval"
                            placeholder="prenom.nom@ulaval.ca"
                            required
                            class="form__input"
                        />
                    </div>

                    <div class="form__group">
                        <label for="program" class="form__label">Programme d'études(Exemple:IFT,BIO,...)</label>
                        <input
                            id="program"
                            name="programme_id"
                            required
                            class="form__input f"
                        />
                    </div>

                    <div class="form__group">
                        <label for="password" class="form__label">Mot de passe</label>
                        <input
                            type="password"
                            id="password"
                            name="mot_de_passe"
                            minlength="8"
                            required
                            class="form__input"
                        />
                    </div>

                    <div class="form__group">
                        <label for="confirmPassword" class="form__label">Confirmer le mot de passe</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirm_password"
                            minlength="8"
                            required
                            class="form__input"
                        />
                    </div>

                    <button type="submit" class="button button--primary button--full">
                        Créer mon compte
                    </button>

                    <p class="form__footer">
                        Déjà inscrit ?
                        <a href="{{ url_for('page_login') }}" class="link">Connectez-vous</a>
                    </p>
                </form>

                <div class="auth__back">
                    <a href="{{ url_for('page_accueil') }}" class="link link--muted">← Retour à l'accueil</a>
                </div>

            </section>
        </div>
    </main>

    <script src="{{ url_for('static', filename='Page_signup.js') }}"></script>
</body>
</html>
